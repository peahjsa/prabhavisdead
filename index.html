<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>funnof webboneld</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
      body {
        background-color: #0011ff;
        background: linear-gradient(45deg, rgb(0, 0, 128), rgb(0, 125, 197), rgb(255, 235, 125)) fixed;
        color: white;
        font-family: 'Space Grotesk', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }

      h1 {
        font-family: 'Bungee', sans-serif;
        font-size: clamp(2rem, 5vw, 4rem);
        color: rgb(58, 248, 0);
        -webkit-text-stroke: 2px black;
        margin-bottom: 10px;
        letter-spacing: 2px;
        text-shadow: 4px 4px 0px rgba(0,0,0,0.2);
      }

      p {
        font-size: 1.2rem;
        max-width: 600px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.9);
        margin-bottom: 30px;
      }

      button {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 1.1rem;
        background-color: rgb(58, 248, 0);
        color: black;
        border: 2px solid black;
        padding: 12px 30px;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: 4px 4px 0px black;
        transition: all 0.2s ease;
      }
      button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0px black;
        background-color: rgb(80, 255, 30);
      }

      button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px black;
      }
    </style>
</head>
<body>

  <h1 class="outlined-text">welcom to prabhavisdead</h1>
  <p>soon its going to be funni websit of prabav and frendz</p>
  <button>click for JAMARCUS</button>

  <script>
    document.querySelector("button").onclick = function() {
      alert("JAMARCUS");
    };
  </script>
</body>
</html>
